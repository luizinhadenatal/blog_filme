<!DOCTYPE html>
<html lang="pt-br">
<head>

    <title>Netflix Filmes - Coraline</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;

            display: flex;

        .descricao h2 {

            color: #e50914;

        .info {
            margin-top: 20px;

        /* Modo escuro */
        .escuro {
            background-color: #121212;
            color: white;
